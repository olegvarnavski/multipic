name: PHP 7.4 and MODX 2.x
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        modx: ["2.6.0", "2.6.5", "2.8.5", "2.8.6"]
    runs-on: ubuntu-22.04
    services:
      mysql:
        image: mysql:5.7
        env:
          MYSQL_ROOT_PASSWORD: multipic-ci-only
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -pmultipic-ci-only"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '7.4'
          extensions: gd, exif, fileinfo, pdo_mysql, xml, simplexml, mbstring, zip
          coverage: none
      - name: Syntax and unit checks
        run: |
          find core assets _build tests -name '*.php' -print0 | xargs -0 -n1 php -l
          php tests/database-api.php
          php tests/gallery.php
          php tests/image.php
          php tests/snippet.php
          node --check assets/components/multipic/js/multipic.js
          npm ci --ignore-scripts
          npm test
      - name: Prepare disposable MODX ${{ matrix.modx }}
        run: |
          curl --fail --location --retry 3 https://modx.com/download/direct/modx-${{ matrix.modx }}-pl.zip -o /tmp/modx.zip
          unzip -q /tmp/modx.zip -d /tmp/multipic-site
          php tests/prepare-site.php /tmp/multipic-site/modx-${{ matrix.modx }}-pl
          php /tmp/multipic-site/modx-${{ matrix.modx }}-pl/setup/index.php --installmode=new
          test -f /tmp/multipic-site/modx-${{ matrix.modx }}-pl/config.core.php
      - name: Build on actual installed MODX and test installation
        env:
          MULTIPIC_TEST_SITE: '1'
        run: |
          php _build/build.transport.php /tmp/multipic-site/modx-${{ matrix.modx }}-pl/config.core.php
          cp /tmp/multipic-site/modx-${{ matrix.modx }}-pl/core/packages/multipic-0.1.2-alpha.transport.zip dist/
          php tests/integration.php /tmp/multipic-site/modx-${{ matrix.modx }}-pl/config.core.php
          php tests/render-integration.php /tmp/multipic-site/modx-${{ matrix.modx }}-pl/config.core.php
      - name: Real HTTP manager session and upload
        env:
          MULTIPIC_TEST_SITE: '1'
        run: |
          site=/tmp/multipic-site/modx-${{ matrix.modx }}-pl
          resource_id=$(php tests/http-fixture.php "$site/config.core.php")
          php -S 127.0.0.1:8085 -t "$site" >/tmp/multipic-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" || true; cat /tmp/multipic-http.log' EXIT
          for attempt in $(seq 1 30); do curl -s http://127.0.0.1:8085/manager/ >/dev/null && break; sleep 1; done
          python3 tests/http-upload.py http://127.0.0.1:8085 "$resource_id"
      - name: Keep tested installer
        uses: actions/upload-artifact@v4
        with:
          name: multipic-php74-modx-${{ matrix.modx }}
          path: dist/multipic-0.1.2-alpha.transport.zip
